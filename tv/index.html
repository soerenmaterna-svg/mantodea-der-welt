<!DOCTYPE html>
<html lang="de">
<head>
<script src="../gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantodea der Welt – Diashow</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; font-family: Arial, Helvetica, sans-serif; }
  .bild { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-color: #000; background-repeat: no-repeat; background-position: center center;
          -webkit-background-size: contain; background-size: contain; opacity: 0; -webkit-transition: opacity 1.2s; transition: opacity 1.2s; }
  .bild.an { opacity: 1; }
  #unten { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 28px; color: #fff;
           background: rgba(0,0,0,0.55); font-size: 26px; line-height: 1.3; }
  #unten i { font-weight: bold; }
  #unten small { display: block; font-size: 15px; color: #ccc; margin-top: 4px; }
  #start { position: absolute; left: 0; right: 0; top: 40%; text-align: center; color: #fff; font-size: 30px; }
</style>
</head>
<body>
<div class="bild" id="b0"></div>
<div class="bild" id="b1"></div>
<div id="start">Diashow wird geladen …</div>
<div id="unten" style="display:none"><i id="name"></i> <span id="auth"></span><small id="credit"></small></div>
<script src="../data/species.js"></script>
<script src="../data/remote.js"></script>
<script src="../data/netzfotos.js"></script>
<script src="../data/unfrei.js"></script>
<script>
// Bewusst sehr einfacher, alter JavaScript-Stil (ES5): läuft auch in den Browsern älterer Fernseher.
(function () {
  var M = window.MANTODEA || { species: [] }, R = window.MANTODEA_REMOTE || {};
  var LIZ = { "cc0": "CC0", "pd": "gemeinfrei", "cc-by": "CC BY", "cc-by-sa": "CC BY-SA", "cc-by-nd": "CC BY-ND", "cc-by-nc": "CC BY-NC", "cc-by-nc-sa": "CC BY-NC-SA", "cc-by-nc-nd": "CC BY-NC-ND" };
  var liste = [], i, s, r;
  for (i = 0; i < M.species.length; i++) {
    s = M.species[i]; r = R[s.k];
    // Fotos aus dem Netz (frei lizenziert und ©), auch für Arten ohne eigenes Foto
    var nz = ((window.MANTODEA_NETZ || {}).fotos || {})[s.k] || [], uf = (window.MANTODEA_UNFREI || {})[s.k] || [], m;
    var ufAn = true; try { ufAn = localStorage.getItem("mantodea-unfrei") !== "0"; } catch (e) {}
    for (m = 0; m < nz.length; m++) {
      if (!nz[m].u && !nz[m].big) continue;
      if (!nz[m].frei && !ufAn) continue;
      liste.push({ n: s.n, a: s.a || "", u: (nz[m].u || "").replace(/\/full\/\^?\d+,\//, "/full/^1600,/") || nz[m].big, by: (nz[m].frei ? "" : "© ") + (nz[m].by || ""), l: nz[m].frei ? nz[m].l || "" : "alle Rechte vorbehalten", q: nz[m].src || "", w: Math.random() * 2 });
    }
    if (ufAn) for (m = 0; m < uf.length; m++) {
      if (!uf[m].big && !uf[m].u) continue;
      liste.push({ n: s.n, a: s.a || "", u: uf[m].big || uf[m].u, by: "© " + (uf[m].by || ""), l: "alle Rechte vorbehalten", q: uf[m].src || "iNaturalist", w: Math.random() * 2 });
    }
    if (!s.p || !r) continue;
    if (r.f) liste.push({ n: s.n, a: s.a || "", u: r.f, by: s.p.by || "", l: LIZ[s.p.l] || s.p.l || "", q: s.p.src || "iNaturalist", w: (s.p.front ? 3 : 1) + Math.random() * 3 });
    // dazu alle Galeriefotos der Art (möglichst viele Bilder)
    var g = r.g || [], j;
    for (j = 0; j < g.length; j++) {
      if (!g[j] || !g[j][0] || g[j][4] === s.p.ref) continue;
      liste.push({ n: s.n, a: s.a || "", u: g[j][0], by: g[j][1] || "", l: LIZ[g[j][2]] || g[j][2] || "", q: g[j][3] || "", w: Math.random() * 2 });
    }
  }
  // gemischt, schöne Titelbilder (adulte Weibchen) bevorzugt
  for (i = 0; i < liste.length; i++) liste[i].z = liste[i].w * Math.random();
  liste.sort(function (x, y) { return y.z - x.z; });
  // nicht zweimal hintereinander dieselbe Art
  for (i = 1; i < liste.length; i++) {
    if (liste[i].n !== liste[i - 1].n) continue;
    for (var k = i + 1; k < Math.min(liste.length, i + 60); k++) if (liste[k].n !== liste[i - 1].n) { var t = liste[i]; liste[i] = liste[k]; liste[k] = t; break; }
  }
  var pos = -1, cur = 0, dauer = 9000;
  var b = [document.getElementById("b0"), document.getElementById("b1")];
  function zeige() {
    if (!liste.length) { document.getElementById("start").innerHTML = "Keine Fotos gefunden."; return; }
    pos = (pos + 1) % liste.length;
    var e = liste[pos], img = new Image(), fertig = false;
    var weiter = function () { if (fertig) return; fertig = true; setTimeout(zeige, 300); };
    img.onload = function () {
      if (fertig) return; fertig = true;
      cur = 1 - cur;
      b[cur].style.backgroundImage = "url('" + e.u.replace(/'/g, "%27") + "')";
      b[cur].className = "bild an"; b[1 - cur].className = "bild";
      document.getElementById("start").style.display = "none";
      document.getElementById("unten").style.display = "block";
      document.getElementById("name").innerHTML = e.n;
      document.getElementById("auth").innerHTML = e.a;
      document.getElementById("credit").innerHTML = "Foto: " + e.by + " · " + e.l + " · " + e.q + " · Mantodea der Welt";
      // nächstes Bild schon vorladen
      var n = liste[(pos + 1) % liste.length]; if (n) { var v = new Image(); v.src = n.u; }
      setTimeout(zeige, dauer);
    };
    img.onerror = weiter;
    setTimeout(weiter, 15000);   // hängt ein Bild, nach 15 Sekunden das nächste
    img.src = e.u;
  }
  zeige();
})();
</script>
</body>
</html>
